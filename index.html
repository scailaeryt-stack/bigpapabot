<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Shop</title>
    <link rel="stylesheet" href="style.css">
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Icons Font (using simple text/svg fallback in CSS or CDN) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="gradient-bg">

    <div id="app">
        <!-- SHOP VIEW -->
        <div id="shop-view" class="view active">
            <h2 style="margin-bottom: 16px;">Магазин</h2>
            <div id="shop-list">
                <!-- Games will be injected here via JS -->
            </div>
        </div>

        <!-- USER PROFILE VIEW (Tab 2) -->
        <div id="user-profile-view" class="view">
            <h2 style="margin-bottom: 16px;">Профиль</h2>
            <div class="profile-card">
                <div class="profile-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h3 id="username-display">Гость</h3>
                <p style="color: var(--text-secondary); margin-top: 4px;">Пользователь</p>
            </div>
            
            <div class="profile-card" style="text-align: left;">
                <h4 style="margin-bottom: 10px;">Статистика</h4>
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span>Заявок:</span>
                    <strong>0</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Получено монет:</span>
                    <strong style="color: var(--primary-yellow);">0</strong>
                </div>
            </div>
        </div>

        <!-- SETTINGS VIEW (Tab 3) -->
        <div id="settings-view" class="view">
            <h2 style="margin-bottom: 16px;">Настройки</h2>
            
            <div class="settings-list">
                <div class="settings-item" onclick="tg.showAlert('Раздел Privacy Policy в разработке')">
                    <div class="settings-icon-box">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="settings-text">Privacy Policy</div>
                    <div class="settings-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
                
                <div class="settings-item" onclick="tg.showAlert('Раздел Terms of Use в разработке')">
                    <div class="settings-icon-box">
                        <i class="fas fa-file-contract"></i>
                    </div>
                    <div class="settings-text">Terms of Use</div>
                    <div class="settings-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>

                <div class="settings-item" onclick="tg.showAlert('Напишите нам: @support_bot')">
                    <div class="settings-icon-box">
                        <i class="fas fa-headset"></i>
                    </div>
                    <div class="settings-text">Support</div>
                    <div class="settings-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: center; color: var(--text-secondary); font-size: 12px;">
                Version 1.0.0
            </div>
        </div>

        <!-- CLAIM VIEW (Game "Profile" / Detail) -->
        <div id="claim-view" class="view">
            <button class="btn-back" onclick="goBack()">
                <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> Назад
            </button>
            
            <div class="claim-header">
                <div class="claim-icon"></div>
                <div class="claim-title" id="claim-title">Game Name</div>
            </div>

            <div class="input-group">
                <label class="input-label">Введите ваш ID</label>
                <input type="text" class="main-input" id="game-id-input" placeholder="Например: 12345678">
            </div>

            <div class="reward-info" id="claim-reward">
                Вы получите: ...
            </div>

            <button class="btn-main" onclick="submitClaim()">Получить</button>
        </div>

        <!-- SUCCESS OVERLAY -->
        <div id="success-overlay" class="success-overlay">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Ваш запрос в обработке!</h2>
            <p style="margin-top: 10px; opacity: 0.9;">Ожидайте зачисления средств.</p>
        </div>

        <!-- TAB BAR -->
        <nav class="tab-bar">
            <div class="tab-item active" id="tab-shop" onclick="switchTab('shop')">
                <i class="fas fa-store tab-icon"></i>
                <span class="tab-label">Магазин</span>
            </div>
            <div class="tab-item" id="tab-profile" onclick="switchTab('profile')">
                <i class="fas fa-user tab-icon"></i>
                <span class="tab-label">Профиль</span>
            </div>
            <div class="tab-item" id="tab-settings" onclick="switchTab('settings')">
                <i class="fas fa-cog tab-icon"></i>
                <span class="tab-label">Настройки</span>
            </div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
